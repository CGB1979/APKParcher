name: Parchear APK por Enlace

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Enlace de Google Drive (.apk, .apkm o .apks)'
        required: true
        type: string
      release_tag:
        description: 'Etiqueta interna para descarga web'
        required: false
        default: 'latest-patched'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Descargar archivo desde Google Drive y detectar nombre
        run: |
          pip install -q gdown
          mkdir -p descarga_dir
          cd descarga_dir
          gdown "${{ github.event.inputs.apk_url }}"
          ARCHIVO_DESCARGADO=$(ls -1 | head -n 1)
          NOMBRE_BASE="${ARCHIVO_DESCARGADO%.*}"
          NOMBRE_LIMPIO=$(echo "$NOMBRE_BASE" | tr ' ' '_' | tr -cd '[:alnum:]_.-')
          echo "NOMBRE_FINAL=${NOMBRE_LIMPIO}_parcheado.apk" >> $GITHUB_ENV
          mv "$ARCHIVO_DESCARGADO" ../descarga.bin
          cd ..
          echo "Archivo original: $ARCHIVO_DESCARGADO -> Salida: ${NOMBRE_LIMPIO}_parcheado.apk"

      - name: Filtrar idioma español y unir si es Bundle (.apkm/.apks)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if unzip -l descarga.bin | grep -q "base.apk"; then
            echo "Detectado Bundle (.apkm/.apks). Analizando idiomas..."
            mkdir -p bundle_dir
            unzip -q descarga.bin -d bundle_dir
            
            if ls bundle_dir/split_config.es*.apk >/dev/null 2>&1; then
              echo "Idioma español encontrado. Conservando únicamente español (es)..."
              find bundle_dir -name "split_config.*.apk" | while read f; do
                fname=$(basename "$f")
                if [[ "$fname" =~ ^split_config\.[a-z]{2}(_[A-Z]{2})?\.apk$ ]] && [[ ! "$fname" =~ ^split_config\.es ]]; then
                  echo "Eliminando idioma: $fname"
                  rm -f "$f"
                fi
              done
            else
              echo "AVISO: Este bundle no incluye split_config.es.apk; se conservará el idioma base."
            fi
            
            gh release download -R REAndroid/APKEditor -p "*.jar" -O APKEditor.jar
            java -jar APKEditor.jar m -i bundle_dir -o original.apk
          else
            echo "Detectado APK único estándar."
            mv descarga.bin original.apk
          fi
          ls -lh original.apk

      - name: Descargar ReVanced CLI y Patches desde la API oficial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R revanced/revanced-cli -p "*-all.jar" -O revanced-cli.jar
          
          HOST="api.revanced.app"
          PATH_API="v5/patches"
          PATCHES_URL=$(curl -sL "https://${HOST}/${PATH_API}" | jq -r '.download_url')
          echo "Descargando parches desde: $PATCHES_URL"
          curl -fL "$PATCHES_URL" -o patches.rvp
          
          ls -lh revanced-cli.jar patches.rvp

      - name: Parchear el APK con ReVanced
        run: |
          java -jar revanced-cli.jar patch -p patches.rvp -b -o "$NOMBRE_FINAL" original.apk
          ls -lh "$NOMBRE_FINAL"

      - name: Publicar APK parcheado para la interfaz web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          gh release delete "$TAG" -R ${{ github.repository }} -y || true
          gh release create "$TAG" "$NOMBRE_FINAL" -R ${{ github.repository }} --title "$NOMBRE_FINAL" --notes "Generado automáticamente para uso personal"
