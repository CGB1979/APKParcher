name: Parchear APK por Enlace

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Pega aquí el enlace de descarga directa del APK'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Descargar el APK original desde tu enlace
        run: |
          curl -fL -A "Mozilla/5.0" "${{ github.event.inputs.apk_url }}" -o original.apk
          ls -lh original.apk

      - name: Descargar ReVanced CLI y Patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R revanced/revanced-cli -p "*-all.jar" -O revanced-cli.jar
          PATCHES_URL=$(curl -sL "https://sourceforge.net" | grep -oE 'https://sourceforge\.net/projects/revanced\.mirror/files/[^"]+\.rvp/download' | head -n 1)
          curl -fL "$PATCHES_URL" -o patches.rvp
          ls -lh revanced-cli.jar patches.rvp

      - name: Parchear el APK con ReVanced
        run: |
          java -jar revanced-cli.jar patch -p patches.rvp -o app-parcheada.apk original.apk

      - name: Guardar el APK parcheado para descargar
        uses: actions/upload-artifact@v4
        with:
          name: APK-Parcheada
          path: app-parcheada.apk
