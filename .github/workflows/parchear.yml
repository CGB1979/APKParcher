name: Parchear APK por Enlace

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Pega aquí tu enlace de Google Drive'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Descargar y verificar el APK original
        run: |
          pip install -q gdown
          gdown "${{ github.event.inputs.apk_url }}" -O original.apk
          ls -lh original.apk
          if ! unzip -tq original.apk >/dev/null 2>&1; then
            echo "ERROR: No se descargó un APK válido. Revisa que el enlace sea público."
            exit 1
          fi

      - name: Descargar ReVanced CLI y Patches desde la API oficial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R revanced/revanced-cli -p "*-all.jar" -O revanced-cli.jar
          
          HOST="api.revanced.app"
          PATH_API="v5/patches"
          PATCHES_URL=$(curl -sL "https://${HOST}/${PATH_API}" | jq -r '.download_url')
          echo "Descargando parches desde: $PATCHES_URL"
          curl -fL "$PATCHES_URL" -o patches.rvp
          
          ls -lh revanced-cli.jar patches.rvp

      - name: Parchear el APK con ReVanced
        run: |
          java -jar revanced-cli.jar patch -p patches.rvp -b -o app-parcheada.apk original.apk

      - name: Guardar el APK parcheado para descargar
        uses: actions/upload-artifact@v5
        with:
          name: APK-Parcheada
          path: app-parcheada.apk
