name: Parchear APK por Enlace

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Pega aquí el enlace de descarga directa del APK'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Descargar el APK original desde tu enlace
        run: |
          curl -L -A "Mozilla/5.0" "${{ github.event.inputs.apk_url }}" -o original.apk
          ls -lh original.apk

      - name: Descargar ReVanced CLI y Patches oficiales
        run: |
          CLI_URL=$(curl -s https://github.com | grep "browser_download_url.*-all\.jar" | cut -d '"' -f 4)
          curl -L "$CLI_URL" -o revanced-cli.jar
          
          PATCHES_URL=$(curl -s https://github.com | grep "browser_download_url.*\.rvp" | cut -d '"' -f 4)
          curl -L "$PATCHES_URL" -o patches.rvp

      - name: Parchear el APK con ReVanced
        run: |
          java -jar revanced-cli.jar patch -p patches.rvp -o app-parcheada.apk original.apk

      - name: Guardar el APK parcheado para descargar
        uses: actions/upload-artifact@v4
        with:
          name: APK-Parcheada
          path: app-parcheada.apk
