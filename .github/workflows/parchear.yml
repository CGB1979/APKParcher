name: Parchear APK por Enlace

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Pega aquí tu enlace de Google Drive (archivo .apk o .apkm)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Descargar archivo desde Google Drive
        run: |
          pip install -q gdown
          gdown "${{ github.event.inputs.apk_url }}" -O descarga.bin
          ls -lh descarga.bin

      - name: Unir si es .apkm / .xapk o preparar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if unzip -l descarga.bin | grep -q "base.apk"; then
            echo "Detectado formato Bundle (.apkm/.xapk). Uniendo archivos con APKEditor..."
            gh release download -R REAndroid/APKEditor -p "*.jar" -O APKEditor.jar
            mv descarga.bin bundle.apkm
            java -jar APKEditor.jar m -i bundle.apkm -o original.apk
          else
            echo "Detectado APK estándar."
            mv descarga.bin original.apk
          fi
          ls -lh original.apk

      - name: Descargar ReVanced CLI y Patches desde la API oficial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R revanced/revanced-cli -p "*-all.jar" -O revanced-cli.jar
          
          HOST="api.revanced.app"
          PATH_API="v5/patches"
          PATCHES_URL=$(curl -sL "https://${HOST}/${PATH_API}" | jq -r '.download_url')
          echo "Descargando parches desde: $PATCHES_URL"
          curl -fL "$PATCHES_URL" -o patches.rvp
          
          ls -lh revanced-cli.jar patches.rvp

      - name: Parchear el APK con ReVanced
        run: |
          java -jar revanced-cli.jar patch -p patches.rvp -b -o app-parcheada.apk original.apk

      - name: Guardar el APK parcheado para descargar
        uses: actions/upload-artifact@v5
        with:
          name: APK-Parcheada
          path: app-parcheada.apk
