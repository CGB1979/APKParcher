<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APKParcher Glaciar</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icon-512.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <main class="glass-container">
    <header class="app-header">
      <img src="assets/icon-512.png" alt="Logo APKParcher" class="app-logo" />
      <div>
        <h1>APKParcher Glaciar</h1>
        <p class="subtitle">Parcheo automático en la nube · Solo Español · Nombre Dinámico</p>
      </div>
    </header>

    <details class="config-panel">
      <summary>
        <span>⚙️ Configuración de GitHub</span>
        <span id="configStatus" class="status-badge">Sin configurar</span>
      </summary>
      <div class="config-grid">
        <div class="field">
          <label for="ghUser">Usuario de GitHub</label>
          <input type="text" id="ghUser" placeholder="tu-usuario" />
        </div>
        <div class="field">
          <label for="ghRepo">Repositorio</label>
          <input type="text" id="ghRepo" value="APKParcher" />
        </div>
        <div class="field full">
          <label for="ghToken">Personal Access Token (PAT)</label>
          <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
        </div>
        <button id="saveConfigBtn" class="btn secondary full" type="button">Guardar Configuración</button>
      </div>
    </details>

    <section class="patcher-box">
      <label for="apkUrl">Enlace público de Google Drive (.apk, .apkm o .apks)</label>
      <div class="input-row">
        <input
          type="url"
          id="apkUrl"
          placeholder="https://drive.google.com/file/d/..."
          required
        />
        <button id="startBtn" class="btn primary" type="button">Iniciar Parcheo</button>
      </div>
      <p class="hint">Conserva automáticamente el idioma español (si el bundle lo incluye) y el nombre original del archivo.</p>
    </section>

    <section id="progressSection" class="progress-section hidden">
      <div class="progress-header">
        <span id="statusText">Preparando entorno...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </section>

    <footer class="actions-footer">
      <button id="downloadBtn" class="btn download" type="button" disabled>
        ⬇️ Descargar APK Parcheado
      </button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
